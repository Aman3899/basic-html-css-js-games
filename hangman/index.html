<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Challenge</title>
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-gray-900 via-indigo-900 to-purple-900 min-h-screen flex items-center justify-center overflow-hidden">
    <!-- Loading Screen -->
    <div class="loading fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="loader relative w-24 h-24">
            <div class="loader-inner"></div>
            <div class="loader-inner"></div>
            <div class="loader-inner"></div>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="relative w-full max-w-3xl p-6 bg-gradient-to-b from-gray-800 to-gray-900 rounded-2xl shadow-2xl">
        <h1 class="text-4xl md:text-5xl font-extrabold text-indigo-400 text-center mb-6">Hangman Challenge</h1>

        <!-- Hangman Display -->
        <div id="hangman" class="flex justify-center mb-6">
            <svg class="w-48 h-48 md:w-64 md:h-64" viewBox="0 0 200 200">
                <g class="hangman-parts">
                    <!-- Gallows -->
                    <line x1="20" y1="180" x2="100" y2="180" stroke="#fff" stroke-width="4"/>
                    <line x1="60" y1="20" x2="60" y2="180" stroke="#fff" stroke-width="4"/>
                    <line x1="60" y1="20" x2="120" y2="20" stroke="#fff" stroke-width="4"/>
                    <line x1="120" y1="20" x2="120" y2="40" stroke="#fff" stroke-width="4"/>
                    <!-- Head -->
                    <circle cx="120" cy="60" r="20" fill="none" stroke="#fff" stroke-width="4" class="hidden"/>
                    <!-- Body -->
                    <line x1="120" y1="80" x2="120" y2="120" stroke="#fff" stroke-width="4" class="hidden"/>
                    <!-- Left Arm -->
                    <line x1="120" y1="90" x2="100" y2="110" stroke="#fff" stroke-width="4" class="hidden"/>
                    <!-- Right Arm -->
                    <line x1="120" y1="90" x2="140" y2="110" stroke="#fff" stroke-width="4" class="hidden"/>
                    <!-- Left Leg -->
                    <line x1="120" y1="120" x2="100" y2="150" stroke="#fff" stroke-width="4" class="hidden"/>
                    <!-- Right Leg -->
                    <line x1="120" y1="120" x2="140" y2="150" stroke="#fff" stroke-width="4" class="hidden"/>
                </g>
            </svg>
        </div>

        <!-- Word Display -->
        <div id="word-display" class="text-3xl md:text-4xl font-mono text-white text-center mb-6 tracking-widest"></div>

        <!-- Keyboard -->
        <div id="keyboard" class="grid grid-cols-7 md:grid-cols-13 gap-2 mb-6"></div>

        <!-- Game Info -->
        <div class="flex justify-between items-center text-gray-200 text-lg font-semibold">
            <span>Guesses Left: <span id="guesses-left">6</span></span>
            <span>Score: <span id="score">0</span></span>
        </div>

        <!-- Start Button -->
        <button id="start-btn" class="btn btn-start mt-6 w-full md:w-auto mx-auto block">Start Game</button>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="modal-content bg-gradient-to-br from-indigo-800 to-indigo-600 rounded-2xl p-8 w-11/12 max-w-md shadow-xl">
            <h2 id="result-title" class="text-3xl md:text-4xl font-extrabold text-yellow-300 mb-6"></h2>
            <p id="result-word" class="text-xl md:text-2xl text-white mb-4">Word: </p>
            <p id="result-score" class="text-lg md:text-xl text-white mb-6">Score: 0</p>
            <div class="modal-buttons flex flex-col md:flex-row gap-4 justify-center">
                <button class="btn btn-retry" onclick="retryGame()">Retry</button>
                <button class="btn btn-reveal" onclick="revealWord()">Reveal Word</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
